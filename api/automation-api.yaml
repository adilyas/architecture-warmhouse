openapi: 3.0.4
info:
  title: Automation Service API
  description: Сервис управления автоматизацией для датчиков, действий и триггеров
  version: 1.0.0

servers:
  - url: http://12.34.56.90:8080
    description: Сервис управления автоматизацией

paths:
  /sensors:
    post:
      summary: Создание нового датчика
      description: Создает новый датчик для устройства
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreateRequest'
      responses:
        '201':
          description: Датчик успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Устройство не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Получение всех датчиков
      description: Возвращает все датчики для устройств аутентифицированного пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: query
          description: Фильтр датчиков по ID устройства
          schema:
            $ref: '#/components/schemas/DeviceId'
      responses:
        '200':
          description: Датчики успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SensorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sensors/{sensorId}:
    get:
      summary: Получение датчика по ID
      description: Возвращает конкретный датчик по ID
      security:
        - bearerAuth: []
      parameters:
        - name: sensorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SensorId'
      responses:
        '200':
          description: Датчик успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Датчик не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновление датчика
      description: Обновляет существующий датчик
      security:
        - bearerAuth: []
      parameters:
        - name: sensorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SensorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorUpdateRequest'
      responses:
        '200':
          description: Датчик успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SensorResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Датчик не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Удаление датчика
      description: Удаляет существующий датчик
      security:
        - bearerAuth: []
      parameters:
        - name: sensorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SensorId'
      responses:
        '204':
          description: Датчик успешно удален
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Датчик не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /actions:
    post:
      summary: Создание нового действия
      description: Создает новое действие для устройства
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionCreateRequest'
      responses:
        '201':
          description: Действие успешно создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Устройство не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Получение всех действий
      description: Возвращает все действия для устройств аутентифицированного пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: query
          description: Фильтр действий по ID устройства
          schema:
            $ref: '#/components/schemas/DeviceId'
      responses:
        '200':
          description: Действия успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActionResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /actions/{actionId}:
    get:
      summary: Получение действия по ID
      description: Возвращает конкретное действие по ID
      security:
        - bearerAuth: []
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActionId'
      responses:
        '200':
          description: Действие успешно получено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Действие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновление действия
      description: Обновляет существующее действие
      security:
        - bearerAuth: []
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionUpdateRequest'
      responses:
        '200':
          description: Действие успешно обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Действие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Удаление действия
      description: Удаляет существующее действие
      security:
        - bearerAuth: []
      parameters:
        - name: actionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ActionId'
      responses:
        '204':
          description: Действие успешно удалено
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Действие не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /triggers:
    post:
      summary: Создание нового триггера
      description: Создает новый триггер, связывающий датчик с действием
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerCreateRequest'
      responses:
        '201':
          description: Триггер успешно создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Датчик или действие не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      summary: Получение всех триггеров
      description: Возвращает все триггеры для аутентифицированного пользователя
      security:
        - bearerAuth: []
      parameters:
        - name: sensor_id
          in: query
          description: Фильтр триггеров по ID датчика
          schema:
            $ref: '#/components/schemas/SensorId'
        - name: action_id
          in: query
          description: Фильтр триггеров по ID действия
          schema:
            $ref: '#/components/schemas/ActionId'
      responses:
        '200':
          description: Триггеры успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TriggerResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /triggers/{triggerId}:
    get:
      summary: Получение триггера по ID
      description: Возвращает конкретный триггер по ID
      security:
        - bearerAuth: []
      parameters:
        - name: triggerId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TriggerId'
      responses:
        '200':
          description: Триггер успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Триггер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновление триггера
      description: Обновляет существующий триггер
      security:
        - bearerAuth: []
      parameters:
        - name: triggerId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TriggerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerUpdateRequest'
      responses:
        '200':
          description: Триггер успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Триггер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Удаление триггера
      description: Удаляет существующий триггер
      security:
        - bearerAuth: []
      parameters:
        - name: triggerId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/TriggerId'
      responses:
        '204':
          description: Триггер успешно удален
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Триггер не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SensorId:
      type: integer
      minimum: 1
      example: 101

    ActionId:
      type: integer
      minimum: 1
      example: 201

    TriggerId:
      type: integer
      minimum: 1
      example: 301

    DeviceId:
      type: integer
      minimum: 1
      example: 123

    UpdateFrequency:
      type: integer
      minimum: 1
      description: Частота обновления в секундах
      example: 60

    Timestamp:
      type: integer
      description: Unix timestamp в секундах
      example: 1701432000

    SensorState:
      type: string
      maxLength: 1000
      description: Состояние датчика в формате JSON
      example: "{\"temperature\": 22.5, \"humidity\": 45}"

    ActionType:
      type: string
      enum: [turn_on, turn_off, set_temperature, send_notification, open, close]
      example: "set_temperature"

    TriggerType:
      type: string
      enum: [threshold, schedule, state_change, composite]
      example: "threshold"

    TriggerOperator:
      type: string
      enum: [greater_than, less_than, equal, not_equal, greater_or_equal, less_or_equal]
      example: "greater_than"

    TriggerThreshold:
      type: integer
      description: Пороговое значение для сравнения триггера
      example: 25

    SensorCreateRequest:
      type: object
      required:
        - device_id
        - update_frequency
      properties:
        device_id:
          $ref: '#/components/schemas/DeviceId'
        update_frequency:
          $ref: '#/components/schemas/UpdateFrequency'
        last_state:
          $ref: '#/components/schemas/SensorState'

    SensorUpdateRequest:
      type: object
      properties:
        update_frequency:
          $ref: '#/components/schemas/UpdateFrequency'
        last_state:
          $ref: '#/components/schemas/SensorState'

    SensorResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/SensorId'
        device_id:
          $ref: '#/components/schemas/DeviceId'
        update_frequency:
          $ref: '#/components/schemas/UpdateFrequency'
        last_updated_ts:
          $ref: '#/components/schemas/Timestamp'
        last_state:
          $ref: '#/components/schemas/SensorState'
        created_at:
          type: string
          format: date-time
          example: "2023-12-01T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2023-12-01T10:00:00Z"

    ActionCreateRequest:
      type: object
      required:
        - device_id
        - type
      properties:
        device_id:
          $ref: '#/components/schemas/DeviceId'
        type:
          $ref: '#/components/schemas/ActionType'

    ActionUpdateRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ActionType'

    ActionResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/ActionId'
        device_id:
          $ref: '#/components/schemas/DeviceId'
        type:
          $ref: '#/components/schemas/ActionType'
        created_at:
          type: string
          format: date-time
          example: "2023-12-01T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2023-12-01T10:00:00Z"

    TriggerCreateRequest:
      type: object
      required:
        - sensor_id
        - action_id
        - type
        - operator
        - threshold
      properties:
        sensor_id:
          $ref: '#/components/schemas/SensorId'
        action_id:
          $ref: '#/components/schemas/ActionId'
        type:
          $ref: '#/components/schemas/TriggerType'
        operator:
          $ref: '#/components/schemas/TriggerOperator'
        threshold:
          $ref: '#/components/schemas/TriggerThreshold'

    TriggerUpdateRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TriggerType'
        operator:
          $ref: '#/components/schemas/TriggerOperator'
        threshold:
          $ref: '#/components/schemas/TriggerThreshold'

    TriggerResponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/TriggerId'
        sensor_id:
          $ref: '#/components/schemas/SensorId'
        action_id:
          $ref: '#/components/schemas/ActionId'
        type:
          $ref: '#/components/schemas/TriggerType'
        operator:
          $ref: '#/components/schemas/TriggerOperator'
        threshold:
          $ref: '#/components/schemas/TriggerThreshold'
        created_at:
          type: string
          format: date-time
          example: "2023-12-01T10:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2023-12-01T10:00:00Z"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
